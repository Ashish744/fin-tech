<!DOCTYPE html>
<html lang="en">
  <head>
<script>try{var p=location.pathname.split('/').pop();if(sessionStorage.getItem('pt')&&p!==''&&p!=='index.html'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pt-in');sessionStorage.removeItem('pt')}catch(e){}</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — Fintech Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/motion.css">
  </head>
  <body data-page="login">
    <div class="auth">
      <aside>
        <a class="logo" href="index.html" style="color:#fff"><img src="assets/logo/logo.webp" alt="Stackly" width="173" height="50"></a>
        <div>
          <h2>Welcome back.</h2>
          <p style="opacity:.75;margin-top:1rem;max-width:34ch">Your balances, goals and recent activity are waiting.</p>
        </div>
        <div class="auth-visual">
          <img src="assets/images/home2.webp" alt="Financial charts on a tablet">
        </div>
        <small style="opacity:.6">© 2026 Fintech Platform</small>
      </aside>
      <main>
        <form data-validate data-success="Signed in. Redirecting…" data-role-redirect aria-labelledby="t">
          <a class="back-home" href="index.html">Back to home</a>
          <h1 id="t" style="font-size:2.2rem">Log in</h1>
          <fieldset class="fd role-choice" data-required-choice>
            <legend>Choose your dashboard</legend>
            <div class="role-options">
              <label><input type="radio" name="dashboard" value="public-dashboard.html"><span>Public dashboard</span></label>
              <label><input type="radio" name="dashboard" value="admin-dashboard.html"><span>Admin dashboard</span></label>
            </div>
            <span class="err" role="alert"></span>
          </fieldset>
          <div class="fd">
            <label for="e">Email</label>
            <input id="e" type="email" data-v="email" autocomplete="email"><span class="err" role="alert"></span>
          </div>
          <div class="fd">
            <label for="p">Password</label>
            <input id="p" type="password" data-v="pass" autocomplete="current-password">
            <button type="button" class="eye" aria-label="Show password">👁</button>
            <span class="err" role="alert"></span>
          </div>
          <div style="display:flex;justify-content:space-between;margin:.5rem 0 1.4rem;font-size:.9rem">
            <label><input type="checkbox"> Remember me</label>
            <a href="contact.html" style="color:var(--blue)">Forgot password?</a>
          </div>
          <button class="btn" style="width:100%" type="submit">Log in</button>
          <p class="up success" hidden style="margin-top:1rem"></p>
          <p style="margin-top:1.4rem;color:var(--mute)">New here? <a href="create-account.html" style="color:var(--blue);font-weight:700">Create an account</a></p>
        </form>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/text.js"></script><script src="js/motion.js"></script><script src="js/cards.js"></script><script src="js/textfx.js"></script>
  </body>
</html>
